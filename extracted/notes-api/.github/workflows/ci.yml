name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Install composer deps
        run: composer install --no-progress --no-suggest --prefer-dist
      - name: Run migrations
        run: php bin/migrate.php
      - name: Run tests
        run: composer test