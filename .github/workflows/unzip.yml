name: Unzip uploaded zip files and open PRs

on:
  push:
    paths:
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  unzip-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Unzip and create PRs
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          found=0
          # find zip files (ignore .github/workflows/unzip.yml itself)
          find . -type f -name '*.zip' -print0 | while IFS= read -r -d '' z; do
            found=1
            # normalize names
            zip_rel="$(realpath --relative-to="$PWD" "$z")"
            zip_base="$(basename "$z")"
            name_noext="${zip_base%.*}"
            safe_name="$(echo "$name_noext" | sed 's/[^A-Za-z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')"
            branch="extract-${safe_name}-$(date +%s)"

            echo "Processing $zip_rel -> branch $branch"

            # create branch from current default (assume main)
            git checkout -b "$branch"

            mkdir -p "extracted/$safe_name"
            unzip -o "$zip_rel" -d "extracted/$safe_name" >/dev/null

            # stage changes
            git add "extracted/$safe_name"

            if git diff --staged --quiet; then
              echo "No changes after extracting $zip_base; skipping"
              git checkout main || git checkout -
              git branch -D "$branch" || true
              continue
            fi

            git commit -m "Extract contents of $zip_base into extracted/$safe_name"

            # push branch
            git push --set-upstream origin "$branch"

            # create a PR via REST API
            pr_title="Extracted contents of $zip_base"
            pr_body="This PR adds files extracted from `$zip_base` into `extracted/$safe_name`.\n\nReview before merging."
            api_url="https://api.github.com/repos/$REPO/pulls"
            echo "Creating PR for $branch -> main"
            resp="$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$api_url" -d "$(jq -n --arg t "$pr_title" --arg h "$branch" --arg b "$pr_body" --arg base "main" '{title:$t, head:$h, base:$base, body:$b}')" )"
            echo "$resp" | jq -r '.html_url // .message // .errors[0].message' || true

            # switch back to main for next zip
            git checkout main || git checkout -
          done

          if [ "$found" -eq 0 ]; then
            echo "No zip files found; nothing to do."
          fi
